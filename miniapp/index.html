<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Voice Battle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="title">Voice Battle</div>
        <div class="subtitle" id="sub">Yuklanmoqda…</div>
      </div>
      <button class="ghost" onclick="switchTab('profile')">Profil</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="home">Asosiy</button>
      <button class="tab" data-tab="channels">Kanallar</button>
      <button class="tab" data-tab="create">Yaratish</button>
      <button class="tab" data-tab="battles">Mening battle</button>
    </nav>

    <main>
      <section id="tab-home" class="panel active">
        <div class="card">
          <div class="row">
            <div><div class="big" id="statUsers">—</div><div class="muted">Users</div></div>
            <div><div class="big" id="statActive">—</div><div class="muted">Active</div></div>
            <div><div class="big" id="statVotes">—</div><div class="muted">Votes</div></div>
          </div>
        </div>
        <div id="activeBattles"></div>
      </section>

      <section id="tab-channels" class="panel">
        <div class="card">
          <h3>Kanal qo‘shish</h3>
          <p class="muted">Bot kanalga admin bo‘lishi kerak.</p>
          <div class="field">
            <input id="channelInput" placeholder="@kanal_username" />
            <button onclick="addChannel()">Qo‘shish</button>
          </div>
          <div id="channelMsg" class="muted"></div>
        </div>
        <div id="channelsList"></div>
      </section>

      <section id="tab-create" class="panel">
        <div class="card">
          <h3>Yangi battle</h3>
          <div class="grid">
            <input id="battleName" placeholder="Battle nomi" />
            <select id="channelSelect"></select>
            <input id="targetVotes" type="number" min="1" placeholder="Maqsad ovoz" />
            <input id="winnersCount" type="number" min="1" placeholder="G‘oliblar soni" />
            <input id="minWinVotes" type="number" min="1" placeholder="Minimal g‘alaba ovozi" />
            <select id="endMode">
              <option value="target">Ovoz yetganda</option>
              <option value="time">Vaqt bo‘yicha</option>
              <option value="both">Ikkalasi ham</option>
            </select>
            <input id="durationMinutes" type="number" min="1" placeholder="Davomiylik (daq)" />
            <input id="reward" placeholder="Sovrin" />
            <input id="imageUrl" placeholder="Rasm URL (ixtiyoriy)" />
          </div>
          <button class="primary" onclick="createBattle()">Battle yaratish</button>
          <div id="createMsg" class="muted"></div>
        </div>
      </section>

      <section id="tab-battles" class="panel">
        <div id="myBattles"></div>
      </section>

      <section id="tab-profile" class="panel">
        <div class="card">
          <h3>Profil</h3>
          <div id="profileBox" class="muted">—</div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
